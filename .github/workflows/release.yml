name: release

# Two ways to cut a release:
#   1. Push a tag "v<version>" yourself — this workflow verifies it matches
#      package.json and then creates the GitHub Release.
#   2. Run this workflow manually (workflow_dispatch) with a version — it bumps
#      package.json, commits to main, creates the tag and the GitHub Release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (semver, without leading v)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-from-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify CHANGELOG mentions the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qF "[$TAG]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for [$TAG]"
            exit 1
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  release-from-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate version input
        id: ver
        run: |
          V="${{ inputs.version }}"
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::invalid semver version: $V (expected e.g. 0.2.0)"
            exit 1
          }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Verify CHANGELOG has a section for the version
        run: |
          grep -qF "[${{ steps.ver.outputs.version }}]" CHANGELOG.md || {
            echo "::error::add a '## [${{ steps.ver.outputs.version }}]' section to CHANGELOG.md first"
            exit 1
          }

      - name: Verify tag does not exist yet
        run: |
          if git ls-remote --tags origin "v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "::error::tag v${{ steps.ver.outputs.version }} already exists"
            exit 1
          fi

      - name: Bump package.json version
        run: |
          node -e "
            const fs = require('fs');
            const f = 'package.json';
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            p.version = '${{ steps.ver.outputs.version }}';
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
          "

      # Note: tags pushed by GITHUB_TOKEN do not trigger workflows (anti-recursion),
      # so the release is created here directly instead of relying on the tag push event.
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.ver.outputs.version }}" --title "v${{ steps.ver.outputs.version }}" --generate-notes
